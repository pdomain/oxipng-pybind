name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit checks
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.11.12
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy,rustfmt
      - name: Sync dependencies
        run: uv sync --locked --group dev
      - run: make pre-commit-check

  python-tests:
    name: python tests
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.11.12
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Sync dependencies
        run: uv sync --locked --group dev
      - run: make test-py

  rust-tests:
    name: rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@1.98.0
      - run: make test-rust

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.11.12
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Install cargo-deny
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf
        with:
          tool: cargo-deny@0.19.7
      - name: Sync dependencies
        run: uv sync --locked --group dev
      - run: make dependency-audit

  release-files:
    name: release file checks
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.11.12
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Sync dependencies
        run: uv sync --locked --group dev
      - run: make third-party-notices-check
      - run: make wheel
